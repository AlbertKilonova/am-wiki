<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 · AlightMotionWiki</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #f2f1ec; color: #121212;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #101010; color: #f0efe9; } }
      main { width: min(560px, 100%); border-top: 2px solid currentColor; padding-top: 20px; }
      .no { color: #e2231a; font-size: 13px; letter-spacing: .18em; }
      h1 { font-size: clamp(28px, 7vw, 44px); line-height: 1.08; margin: 10px 0 12px; letter-spacing: -.02em; }
      p { font-size: 14px; line-height: 1.7; opacity: .72; margin: 0 0 22px; }
      a { display: inline-block; border: 1px solid currentColor; padding: 10px 18px; color: inherit;
          text-decoration: none; font-size: 13px; letter-spacing: .08em; }
      a:hover { background: #e2231a; border-color: #e2231a; color: #f2f1ec; }
    </style>
  </head>
  <body>
    <main>
      <span class="no">ERROR 404</span>
      <h1>这一页没有存档</h1>
      <p>地址可能拼错了，或者文章已经改名。回到索引页重新找一遍。</p>
      <a href="/">← INDEX</a>
    </main>
  </body>
</html>
